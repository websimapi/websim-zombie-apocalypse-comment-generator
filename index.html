<html>
<head>
  <title>Zombie Apocalypse Comment Generator</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Creepster&family=Special+Elite&display=swap');
    
    body {
      font-family: 'Special Elite', cursive;
      background-color: #1a1a1a;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-image: linear-gradient(to bottom, #1a1a1a 0%, #2d2d2d 100%);
      color: #c9c9c9;
    }
    
    .container {
      width: 90%;
      max-width: 800px;
      background-color: #232323;
      border: 3px solid #4a0000;
      border-radius: 15px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.5);
      padding: 20px;
      position: relative;
    }
    
    .title-bar {
      background-color: #660000;
      color: #f8f8f8;
      padding: 10px 15px;
      border-radius: 10px 10px 0 0;
      margin: -20px -20px 20px -20px;
      text-align: center;
      font-family: 'Creepster', cursive;
      box-shadow: 0 3px 5px rgba(0,0,0,0.4);
    }
    
    h1 {
      margin: 0;
      font-size: 32px;
      font-weight: normal;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
      letter-spacing: 2px;
    }
    
    .main-content {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    
    .input-area {
      background-color: #333333;
      border: 2px solid #4a0000;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
    }
    
    .input-label {
      font-weight: bold;
      margin-bottom: 5px;
      color: #c9c9c9;
    }
    
    textarea {
      width: 100%;
      height: 120px;
      border: 1px solid #444;
      border-radius: 5px;
      padding: 10px;
      font-family: 'Special Elite', cursive;
      font-size: 16px;
      resize: none;
      background-color: #2a2a2a;
      color: #c9c9c9;
    }
    
    .button-area {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 15px 0;
    }
    
    button {
      background-color: #8b0000;
      color: #f8f8f8;
      border: none;
      border-radius: 5px;
      padding: 12px 25px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      font-family: 'Special Elite', cursive;
      box-shadow: 0 3px 5px rgba(0,0,0,0.2);
    }
    
    button:hover {
      background-color: #a30000;
      transform: translateY(-2px);
    }
    
    button:active {
      transform: translateY(0);
    }
    
    .output-area {
      background-color: #333333;
      border: 2px solid #4a0000;
      border-radius: 8px;
      padding: 15px;
      min-height: 300px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    
    #result {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #c9c9c9;
    }
    
    #resultImage {
      max-width: 100%;
      max-height: 400px;
      display: none;
      border-radius: 5px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.5);
    }
    
    .loading {
      display: none;
      justify-content: center;
      margin: 10px 0;
    }
    
    .loading-dot {
      width: 12px;
      height: 12px;
      background-color: #a30000;
      border-radius: 50%;
      margin: 0 5px;
      animation: pulse 1.5s infinite ease-in-out;
    }
    
    .loading-dot:nth-child(2) {
      animation-delay: 0.2s;
    }
    
    .loading-dot:nth-child(3) {
      animation-delay: 0.4s;
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.3); opacity: 1; }
    }
    
    .footer {
      margin-top: 20px;
      color: #666;
      font-size: 14px;
      text-align: center;
    }
    
    /* Zombie decorative elements */
    .zombie-decoration {
      position: absolute;
      right: -80px;
      bottom: -80px;
      width: 200px;
      height: 200px;
      z-index: -1;
      opacity: 0.7;
    }
    
    .blood-splatter {
      position: absolute;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background-color: #8b0000;
      filter: blur(20px);
      opacity: 0.3;
    }
    
    .blood-splatter-1 {
      top: -30px;
      left: 10%;
    }
    
    .blood-splatter-2 {
      bottom: 20px;
      right: 5%;
    }
    
    @media (max-width: 768px) {
      .container {
        width: 95%;
        padding: 15px;
      }
      
      .zombie-decoration {
        width: 150px;
        height: 150px;
        right: -50px;
        bottom: -50px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="blood-splatter blood-splatter-1"></div>
    <div class="blood-splatter blood-splatter-2"></div>
    
    <div class="title-bar">
      <h1>ZOMBIE APOCALYPSE GENERATOR</h1>
    </div>
    
    <div class="main-content">
      <div class="input-area">
        <div class="input-label">Enter your message to share with fellow survivors:</div>
        <textarea id="inputText" placeholder="Type your apocalyptic message here..."></textarea>
      </div>
      
      <div class="button-area">
        <button id="generateBtn" onclick="generateZombieImage()">Generate Zombie Image</button>
        <button id="clearBtn" onclick="clearText()">Clear</button>
      </div>
      
      <div class="loading" id="loadingIndicator">
        <div class="loading-dot"></div>
        <div class="loading-dot"></div>
        <div class="loading-dot"></div>
      </div>
      
      <div class="output-area">
        <div id="result">Your apocalyptic message will appear here...</div>
        <img id="resultImage" alt="Zombie apocalypse image with your text" />
      </div>
    </div>
    
    <div class="footer">
      Survive. Fight. Live.
    </div>
    
    <!-- Zombie hand SVG -->
    <svg class="zombie-decoration" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <!-- Zombie hand coming out of the ground -->
      <path d="M100,200 C100,180 110,160 110,140 C110,120 100,110 90,100 C80,90 70,80 70,70 C70,60 80,50 90,50 C100,50 110,60 110,70" 
            fill="none" stroke="#2d4f1e" stroke-width="15" stroke-linecap="round" />
      <!-- Fingers -->
      <path d="M90,50 C85,40 80,35 75,35" fill="none" stroke="#2d4f1e" stroke-width="10" stroke-linecap="round" />
      <path d="M90,50 C95,40 100,35 105,30" fill="none" stroke="#2d4f1e" stroke-width="10" stroke-linecap="round" />
      <path d="M90,50 C90,40 90,35 90,25" fill="none" stroke="#2d4f1e" stroke-width="10" stroke-linecap="round" />
      <!-- Dirt mound -->
      <ellipse cx="100" cy="200" rx="60" ry="20" fill="#3d2c17" />
    </svg>
  </div>

  <script>
    async function generateZombieImage() {
      const inputText = document.getElementById('inputText').value.trim();
      
      if (!inputText) {
        document.getElementById('result').textContent = "You need to enter a message first!";
        return;
      }
      
      // Show loading indicator
      document.getElementById('loadingIndicator').style.display = 'flex';
      document.getElementById('result').textContent = 'Generating your zombie apocalypse message...';
      document.getElementById('resultImage').style.display = 'none';
      document.getElementById('generateBtn').disabled = true;
      
      try {
        // Generate the image prompt based on the input text
        const completion = await websim.chat.completions.create({
          messages: [
            {
              role: "system",
              content: "You are a zombie apocalypse scenario creator. Given the user's message, create a brief but vivid description of a zombie apocalypse scene that would make an appropriate background for this message. Describe a dark, atmospheric scene that would be appropriate for a horror movie poster or survival game. Keep your response to 1-2 sentences, focusing only on the visual scene, not the user's message."
            },
            {
              role: "user",
              content: inputText
            }
          ]
        });
        
        const imagePrompt = `Zombie apocalypse scene: ${completion.content}. Photorealistic, dark, gritty, horror`;
        
        // Generate the image
        const imageResult = await websim.imageGen({
          prompt: imagePrompt,
          aspect_ratio: "16:9",
        });
        
        // Display the image
        const resultImage = document.getElementById('resultImage');
        resultImage.src = imageResult.url;
        resultImage.style.display = 'block';
        
        // Create a canvas to add text to the image
        const img = new Image();
        img.crossOrigin = "Anonymous";
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          
          // Set canvas dimensions to match the image
          canvas.width = img.width;
          canvas.height = img.height;
          
          // Draw the image on the canvas
          ctx.drawImage(img, 0, 0);
          
          // Add text overlay
          ctx.font = 'bold 28px "Special Elite"';
          ctx.fillStyle = 'white';
          ctx.strokeStyle = 'black';
          ctx.lineWidth = 2;
          
          // Word wrap text
          const maxWidth = canvas.width - 40;
          const lineHeight = 35;
          const x = 20;
          let y = canvas.height - 40;
          
          const words = inputText.split(' ');
          let line = '';
          
          // Start from bottom and go up for text
          const lines = [];
          
          for(let n = 0; n < words.length; n++) {
            const testLine = line + words[n] + ' ';
            const metrics = ctx.measureText(testLine);
            const testWidth = metrics.width;
            
            if (testWidth > maxWidth && n > 0) {
              lines.push(line);
              line = words[n] + ' ';
            } else {
              line = testLine;
            }
          }
          lines.push(line);
          
          // Calculate starting Y based on number of lines
          y = canvas.height - (lines.length * lineHeight) - 20;
          
          // Semi-transparent background for text
          ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
          ctx.fillRect(0, y - 20, canvas.width, lines.length * lineHeight + 40);
          
          // Draw text
          ctx.fillStyle = 'white';
          for(let i = 0; i < lines.length; i++) {
            ctx.strokeText(lines[i], x, y + (i * lineHeight));
            ctx.fillText(lines[i], x, y + (i * lineHeight));
          }
          
          // Convert canvas to data URL and set as image source
          resultImage.src = canvas.toDataURL('image/jpeg');
          
          // Hide loading text
          document.getElementById('result').textContent = '';
        };
        img.src = imageResult.url;
        
      } catch (error) {
        console.error('Error:', error);
        document.getElementById('result').textContent = "An error occurred. Please try again later.";
        document.getElementById('resultImage').style.display = 'none';
      } finally {
        // Hide loading indicator
        document.getElementById('loadingIndicator').style.display = 'none';
        document.getElementById('generateBtn').disabled = false;
      }
    }
    
    function clearText() {
      document.getElementById('inputText').value = '';
      document.getElementById('result').textContent = "Your apocalyptic message will appear here...";
      document.getElementById('resultImage').style.display = 'none';
    }
    
    // Allow Enter key to trigger generation
    document.getElementById('inputText').addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        generateZombieImage();
      }
    });
  </script>

</body>
